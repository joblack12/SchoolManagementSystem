services:
  schoolmanagementsystem:
    image: joblack12/schoolmanagementsystem:latest
    build:
      context: .
      dockerfile: SchoolManagementSystem/Dockerfile
    user: root
    init: true
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - COMPlus_ThreadPool_MinThreads=200
      - ASPNETCORE_URLS=http://+:80
      - AppUrl=http://localhost:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SchoolDbContext;User Id=sa;Password=Maryajoeblack12#;TrustServerCertificate=True;MultipleActiveResultSets=True;Connect Timeout=120;
    volumes:
      - dataprotection_keys:/app/keys
    depends_on:
      sqlserver:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Maryajoeblack12#
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
  dataprotection_keys: