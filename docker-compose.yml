services:
  schoolmanagementsystem:
    image: joblack12/schoolmanagementsystem:latest
    build:
      context: .
      dockerfile: SchoolManagementSystem/Dockerfile
    user: root
    init: true
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - COMPlus_ThreadPool_MinThreads=200
      - ASPNETCORE_URLS=http://+:80
      - AppUrl=${APP_URL}
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SchoolDbContext;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Connect Timeout=120;
    volumes:
      - dataprotection_keys:/app/keys
      - app_uploads:/app/wwwroot/uploads
      - app_logs:/app/Logs
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s


volumes:
  mssql_data:
  dataprotection_keys:
  app_uploads:
  app_logs:
