services:
  caddy:
    image: caddy:2-alpine
    container_name: schoolmanagement-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - schoolmanagementsystem
    networks:
      - school-net

  schoolmanagementsystem:
    image: joblack12/schoolmanagementsystem:${IMAGE_TAG:-latest}
    container_name: schoolmanagement-web
    restart: unless-stopped
    user: root
    init: true
    expose:
      - "80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - COMPlus_ThreadPool_MinThreads=200
      - AppUrl=${APP_URL:-http://localhost}
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=SchoolDbContext;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Connect Timeout=120;
      - Tokens__Key=${JWT_SECRET_KEY:-ChangeThisToYour32CharacterJwtSecretKey!}
    volumes:
      - dataprotection_keys:/app/keys
      - app_uploads:/app/wwwroot/uploads
      - app_logs:/app/Logs
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - school-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: schoolmanagement-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Express
      - MSSQL_MEMORY_LIMIT_MB=2048
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 30s
      retries: 10
      start_period: 60s
    networks:
      - school-net

volumes:
  mssql_data:
  dataprotection_keys:
  app_uploads:
  app_logs:
  caddy_data:
  caddy_config:

networks:
  school-net:
    driver: bridge
